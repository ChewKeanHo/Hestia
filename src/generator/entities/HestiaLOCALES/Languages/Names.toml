# successful translations in the past so DO NOT try to fill in
# "unavailable", repeated values from existing ones, leave it empty, or
# produce translation that uses placeholder characters like '�', '𑅌',
# or '?'.
#
# For your translations, suffix it with " [AI]" in the comment so that
# future human translators know where and what to continue working easily.
# The suffix indicator is already sufficient so do not add any additional
# notes into the content or the comment. Since the values are the native
# name of the language for seamless identification, the value MUST BE in
# Titlecase whenever applicable.
#
# This prompt is called via API. You DO NOT need to explain anything. Your
# output MUST BE strictly only the updated [TEXT] section including the
# existing ones in HTML preformatting quotes format readily available for
# copy-paste back into the data file.
