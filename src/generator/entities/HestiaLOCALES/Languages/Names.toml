# Text.[LANG]{-[SCRIPT]}{-[COUNTRY]} = \"[VALUE]\"
# The actual text-based language identifier for all known written languages
# across the globe. It is compatible with a lot of existing functions like
# search engine optimization (SEO), UNIX OSes locales, app locales, and etc.
# The structure is formulated by 3 international standard segments
# connected with a dash (-) prefix except the first one of course:
#   * [LANG]    - ISO639. Set-1 s prioritized, then Set-2, and lastly
#                 Set-3. To avoid repetition across all permutations, only
#                 1 set is used. Value MUST always be in 'lowercase'.
#                 This field is compulsory.
#   * [SCRIPT]  - ISO15924. Use the 4 letter Codes. Value MUST always be
#                 'Titlecase'. This field is optional.
#   * [COUNTRY] - ISO3166. Set-1 Alpha-2 is prioritized. In Worst case is
#                 ISO3166-1 Alpha-3. Value MUST always be 'UPPERCASE'.
#                 This field is optional.
#
# Examples:
#   * English (Universal) = 'en'
#   * Chinese (Universal - Simplified) = 'zh-Hans'
#   * Chinese (Universal - Traditional) = 'zh-Hant'
#   * English (United States) = 'en-US'
#   * Chinese (United States - Simplified) = 'zh-Hans-US'
#   * Chinese (United States - Traditional) = 'zh-Hant-US'
#   * English (Malaysia) = 'en-MY'
#   * Chinese (Malaysia - Simplified) = 'zh-Hans-MY'
#   * Chinese (Malaysia - Traditional) = 'zh-Hant-MY'
#
# For this sheet, in any case, the '[COUNTRY]' field is completely omitted
# for simplification purposes. This is done by eliminating all geo-political
# omplications against any universal natural language. Localized users can
# append the country in their application level for geo-fencing and other
# geo-political related businesses. Here are some case studies:
#   1. English (en) Vocabulary: 'color'(en-US), 'colour'(en-GB)
#   2. English (en) Math: 'metric tons'(en-US), 'tons'(en-GB)
#   3. English (en) Local: 'obviously'(en-GB), 'duh'(en-MY), 'abuden'(en-SG)
#   4. English (en) Vocal 'tomato': 'to-may-to'(en-US), 'to-ma-to'(en-GB)
#   5. Chinese (zh-Han{s,t}): '华语'(zh-Hans-CN), '華語'(zh-Hant-CN|zh-HK|zh-TW)
#   6. Chinese (nan-Han{s,t}): '闽南语'(nan-Hans-TW), '閩南語'(nan-Hant-TW)
#   ...
#
# For maintenance sake, the list **MUST** be alphabetically sorted with
# respect to [LANG]-[SCRIPT]-[COUNTRY], top to bottom. It is ok for some
# languages distancing themselves from one another due to multiple ISO639-1
# entries like 'Norwegian'.
#
# This list excludes 'Braille' (blind tactile) and 'Sign Language'
# (deaf visual). They are not completely develop yet (e.g. only focus on Latin,
# conflicting codepoints, etc). Also, some of them makes no sense
# (e.g. deaf people can read; most display screen are not tactile touchable).
#
# For font display, it is recommended to download and install the entire
# suite of Noto Project (https://github.com/notofonts) totalling ~200+Mb in
# size and growing. Noto project is by far can display most of the characters
# without problems. Should there be any tofu square or question mark, it means
# the required font is missing. Some exotic fonts like Klingon and Quenya
# require additional compatible font downloads. Be careful with avoiding
# copyright infrignement during procurement.
#
# For language value, **ONLY USE THE NATIVE NAME (in that language)** without
# the 'Language' wording inside. This is an important consideration for user
# with single language where they can only recognize the text they know.
# Otherwise, you're looking at maintaining a very big amount of naming
# databases following this math equation:
#            TOTAL LIST = TOTAL_LANGUAGES ^ TOTAL_LANGUAGES
#
# For best performance, the following work process is recommended:
#   1. Human translators fill in as many fields as possible. Look into
#      Wikipedia since all past contributors already translated most of the
#      languages name in their native form.
#   2. Should any language has multiple scripts (e.g. 'Avaric'), create the
#      all discovered entries and study the historical section for
#      current official one and label it as 'Official'. Some languages has
#      multiple official scripts (notably 'Bosnian') so look for majority
#      preferences and label it as 'Common' instead. Languages in single
#      writing script excluding 'Braille' and 'Sign Language'
#      (e.g. 'Latin' for 'English') can operate without its [SCRIPT] segment.
#      The general rules are:
#          1. simple and concise; AND
#          2. less is good; AND
#          3. seamless and intuitive user experience.
#      Here's some case studies:
#          ...
#          "av-Arab" = "آوَار" # Avaric (Arabic)
#          "av-Cyrl" = "авар" # Avaric (Cyrillic) - Official
#          "av-Latn" = "avar" # Avaric (Latin)
#          "ay" = "Aymar aru" # Aymara
#          ...
#          "br" = "brezhoneg" # Breton
#          "brx-Beng" = "বড়ো" # Boro | Bodo (Bengali)
#          "brx-Deva" = "बड़ो" # Boro | Bodo (Devanagari) - Official
#          "brx-Latn" = "Bodo" # Boro | Bodo (Latin)
#          "bs-Cyrl" = "босански" # Bosnian
#          "bs-Latn" = "bosanski" # Bosnian - Common
#          ...
#          "en" = "English" # English
#          ...
#   3. Remove all duplicated root definitions when the language has multiple
#      scripts defined (e.g. 'av' for 'av-Arab', 'av-Cyrl', 'av-Latn').
#      Instead, mark the corresponding script as "Official" or "Common".
#      The data parser will smartly parse and automatically backfill in.
#   4. For each language, you MUST maintain the English name in the comment
#      for maintainers to perform unified data search and indexing (observe
#      '# Avaric'). This dataset complies to international language of science
#      so English is the only one.
#   5. For languages with unknown ISO15924 codes, you can use the following as
#      the placeholder until the ISO board assign one:
#        'Zxxx'  - For unwritten script (has writing system or not)
#        'Zyyy'  - For undetermined script (identifiable|unindentifiable)
#        'Zzzz'  - For uncoded script (known and specific but without ID code)
#   5. If there is any unresovable field, submit the TOML file for large
#      language model (LLM) AI translation. Just copy this entire file content
#      and paste straight into LLM AI without additional prompt. The AI can
#      read the prompt above and process accordingly. Update the file with the
#      answers. For A.I with deep thinking capability, please enable it before
#      sending the prompt.
#   6. Check with your parser and make sure the A.I did not accidentally
#      modify/remove any existing fields. They do mishaps with big prompts
#      like this dataset file.
#   7. The A.I will append its signature '[AI]' in the last element of the
#      comment. From time to time, any human contributor can replace the
#      human-translation replacing the A.I ones and then remove that signature.
#      Any field without '[AI]' is indeed human effort.
#
# You can refer to the following sites for researches and verifications:
#   1. https://iso639-3.sil.org/code_tables/639/data
#   2. https://en.wikipedia.org/wiki/ISO_3166-1
#   3. https://en.wikipedia.org/wiki/ISO_15924
#   4. https://github.com/unicode-org/cldr-json
