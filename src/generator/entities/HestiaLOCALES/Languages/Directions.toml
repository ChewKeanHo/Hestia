# I have a locale identifier data file here where each value is the native
# language name without the 'language' text for consise representation.
# These are TOML fields so please only translate based on existing human
# translated languages and fill in the empty string ones without modifying
# any TOML syntax. DO NOT leave any field empty; DO NOT remove the existing
# ones or misplace any upon your reply. Translate with what you have without
# calling an external API translation service. You already made a number of
# successful translations in the past so DO NOT try to fill in
# "unavailable", repeated values from existing ones, leave it empty, or
# produce translation that uses placeholder characters like '�', '𑅌',
# or '?'.
#
# For your translations, suffix it with " [AI]" in the comment so that
# future human translators know where and what to continue working easily.
# The suffix indicator is already sufficient so do not add any additional
# notes into the content or the comment. Since the values are the native
# name of the language for seamless identification, the value MUST BE in
# Titlecase whenever applicable.
#
# This prompt is called via API. You DO NOT need to explain anything. Your
# output MUST BE strictly only the updated [TEXT] section including the
# existing ones in HTML preformatting quotes format readily available for
# copy-paste back into the data file.
# AI PROMPT END




# Text.[LANG]-[SCRIPT]{-[COUNTRY]} = "[ASSOCIATED VALUE HERE]"
# The actual text-based identification for all known written languages across
# the globe. It is compatible with search engine optimization and a lot of
# locale systems (e.g. UNIX OSes' locales). The structure is formulated by 3
# international standard segments connected with dash (-) prefix:
#   * [LANG]    - ISO639. Set-1 s prioritized, then Set-2, then Set-3. To
#                 avoid repetition across all permutations, only 1 set is
#                 used. Value MUST always be 'lowercase'.
#   * [SCRIPT]  - ISO15924. Use the 4 letter Codes. Value MUST always be
#                 'Titlecase'.
#   * [COUNTRY] - ISO3166. Set-1 Alpha-2 is prioritized. In Worst case is
#                 ISO3166-1 Alpha-3. Value MUST always be 'UPPERCASE'.
#
# Example:
#   * English (Universal) = 'en'
#   * Chinese (Universal - Simplified) = 'zh-Hans'
#   * Chinese (Universal - Traditional) = 'zh-Hant'
#   * English (United States) = 'en-US'
#   * Chinese (United States - Simplified) = 'zh-Hans-US'
#   * Chinese (United States - Traditional) = 'zh-Hant-US'
#   * English (Malaysia) = 'en-MY'
#   * Chinese (Malaysia - Simplified) = 'zh-Hans-MY'
#   * Chinese (Malaysia - Traditional) = 'zh-Hant-MY'
#
# In any case, the [COUNTRY] set is completely omitted for simplification by
# eliminating all geo-political complications against the universal natural
# languages permutations entries. Let the consumer append the country set
# for geo-fencing in their application; not here. Case studies:
#   1. English (en) Vocabulary: 'color'(en-US), 'colour'(en-GB)
#   2. English (en) Math: 'metric tons'(en-US), 'tons'(en-GB)
#   3. English (en) Local: 'obviously'(en-GB), 'duh'(en-MY), 'abuden'(en-SG)
#   4. English (en) Vocal 'tomato': 'to-may-to'(en-US), 'to-ma-to'(en-GB)
#   5. Chinese (zh-Han{s,t}): '华语'(zh-Hans-CN), '華語'(zh-Hant-CN|zh-HK|zh-TW)
#   6. Chinese (nan-Han{s,t}): '闽南语'(nan-Hans-TW), '閩南語'(nan-Hant-TW)
#   ...
#
# For language label (value), **ONLY USE THE NATIVE WORDS** without the
# 'Language' text inside. This is an important consideration for user with
# single language where they can only recognize the text they know.
# Otherwise, you're looking at maintaining a large amount of list following this
# math equation which does not make any sense for maintenance:
#            TOTAL LIST = TOTAL_LANGUAGES ^ TOTAL_LANGUAGES
#
# The list **MUST** be alphabetically sorted with respect to [LANG] + [SCRIPT]
# from top to bottom. It is ok where some are distanced from one another
# (case study: 'Norwegian').
#
# For 'Braille' (blind tactile) and 'Sign Language' (deaf visual), do not
# include them for now. They are not completely develop yet (e.g. only focus
# on Latin, conflicting codepoints, etc). Also, some of them makes no sense
# (e.g. deaf people can read; most display screen are not tactile touchable).
#
# For font display, recommend download and install the entire suite of
# Noto Project (https://github.com/notofonts) which is about 200+Mb in size
# and growing. This will display most of the characters directly. Should there
# be any tofu square or question mark, it means the font is missing. Some fonts
# like Klingon and Quenya require additional compatible font downloads.
#
# For best performance, the following work process is recommended:
#   1. Human translators fill in as many fields as possible. Look into
#      Wikipedia since all past contributors already translated most of the
#      languages name in their native form.
#   2. Should any language has multiple scripts (e.g. 'Avaric'), create the
#      all discovered entries and study the historical section for
#      current official one and label it as 'Official'. Some languages has
#      multiple official scripts (notably 'Bosnian') so look for majority
#      preferences and label it as 'Common' instead. Languages in single
#      writing script excluding 'Braille' and 'Sign Language'
#      (e.g. 'Latin' for 'English') can operate without its [SCRIPT] segment.
#      The general rules are:
#          1. simple and concise; AND
#          2. less is good; AND
#          3. seamless and intuitive user experience.
#      Here's some case studies:
#          ...
#          "av-Arab" = "آوَار" # Avaric (Arabic)
#          "av-Cyrl" = "авар" # Avaric (Cyrillic) - Official
#          "av-Latn" = "avar" # Avaric (Latin)
#          "ay" = "Aymar aru" # Aymara
#          ...
#          "br" = "brezhoneg" # Breton
#          "brx-Beng" = "বড়ো" # Boro | Bodo (Bengali)
#          "brx-Deva" = "बड़ो" # Boro | Bodo (Devanagari) - Official
#          "brx-Latn" = "Bodo" # Boro | Bodo (Latin)
#          "bs-Cyrl" = "босански" # Bosnian
#          "bs-Latn" = "bosanski" # Bosnian - Common
#          ...
#          "en" = "English" # English
#          ...
#   3. Remove all duplicated root definitions when the language has multiple
#      scripts defined (e.g. 'av' for 'av-Arab', 'av-Cyrl', 'av-Latn').
#      Instead, mark the corresponding script as "Official" or "Common".
#      The data parser will smartly parse and automatically backfill in.
#   4. For each language, you MUST maintain the English name in the comment
#      for maintainers to perform unified data search and indexing (observe
#      '# Avaric'). This dataset complies to international language of science
#      so English is the only one.
#   5. If there is any unresovable field, submit the TOML file for large
#      language model (LLM) AI translation. Just copy this entire file content
#      and paste straight into LLM AI without additional prompt. The AI can
#      read the prompt above and process accordingly. Update the file with the
#      answers. For A.I with deep thinking capability, please enable it before
#      sending the prompt.
#   6. Check with your parser and make sure the A.I did not accidentally
#      modify/remove any existing fields. They do mishaps with big prompts
#      like this dataset file.
#   7. The A.I will append its signature '[AI]' in the last element of the
#      comment. From time to time, any human contributor can replace the
#      human-translation replacing the A.I ones and then remove that signature.
#      Any field without '[AI]' is indeed human effort.
